<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://use.typekit.net" crossorigin>
<link rel="stylesheet" href="https://use.typekit.net/ocu8rwo.css">
<title>Page not found | IKDU</title>
<!-- Custom 404 (2026-09-29). GitHub Pages serves this for any unknown address, at any depth, so every link and asset
     here is absolute (/...). Bilingual on one page (there is only one 404). Self-contained: no site.js/CSS needed. -->
<link rel="icon" href="/assets/favicon/favicon.ico" sizes="48x48">
<meta name="theme-color" content="#9b450b">
<style>
  :root { --cream:#eae6df; --bg:#dcd5c3; --camel:#ba8867; --brick:#9b450b; --brown:#773805; --ink:#000;
          --serif:"benton-modern-display", Georgia, serif; --sans:"cofo-sans-variable", Arial, sans-serif; --arabic:"ibm-plex-arabic", Tahoma, sans-serif; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--ink); font-family:var(--sans); min-height:100vh; display:flex; flex-direction:column; }
  header { height:64px; display:grid; place-items:center; border-bottom:1px solid var(--camel); }
  header img { height:40px; width:auto; display:block; }
  main { flex:1; display:grid; place-items:center; padding:48px 16px; }
  .box { width:100%; max-width:760px; display:grid; grid-template-columns:1fr 1fr; gap:48px; }
  .box > div { border-top:1px solid var(--camel); padding-top:24px; }
  .code { font-size:12px; letter-spacing:.25em; text-transform:uppercase; opacity:.7; margin-bottom:12px; }
  h1 { font-family:var(--serif); font-weight:400; font-size:40px; line-height:1.1; margin-bottom:14px; }
  p { line-height:1.6; opacity:.85; margin-bottom:24px; }
  .btns { display:flex; flex-direction:column; gap:10px; align-items:flex-start; }
  .btn { display:inline-block; text-decoration:none; font-size:12px; letter-spacing:.2em; text-transform:uppercase; padding:14px 22px; }
  .solid { background:var(--brick); color:#fff; } .line { border:1px solid var(--ink); color:var(--ink); }
  .ar { direction:rtl; text-align:right; font-family:var(--arabic); }
  .ar h1 { font-family:var(--arabic); font-size:32px; }
  .ar .code, .ar .btn { letter-spacing:0; font-size:14px; }
  @media (max-width:760px) { .box { grid-template-columns:1fr; gap:40px; } h1 { font-size:32px; } }
</style>
</head>
<body>
<header><a href="/"><img src="/assets/web/brand/emblem-brick.png" alt="IKDU" width="44" height="96"></a></header>
<main>
  <div class="box">
    <div>
      <p class="code">404</p>
      <h1>This page has moved or doesn't exist.</h1>
      <p>The link may be old or mistyped. Everything we've built is one click away.</p>
      <div class="btns"><a class="btn solid" href="/">Take me home</a><a class="btn line" href="/transformation.html">Concept → Reality</a></div>
    </div>
    <div class="ar" lang="ar">
      <p class="code">404</p>
      <h1>هذه الصفحة غير موجودة أو تم نقلها.</h1>
      <p>ربما يكون الرابط قديمًا أو فيه خطأ. كل مشاريعنا على بعد ضغطة واحدة.</p>
      <div class="btns"><a class="btn solid" href="/ar/hero.html">للصفحة الرئيسية</a><a class="btn line" href="https://wa.me/201002021208">كلّمنا واتساب</a></div>
    </div>
  </div>
</main>
</body>
</html>
